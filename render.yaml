# Render Blueprint — Infrastructure as Code
# Deploy with: https://render.com/deploy → connect your GitHub repo
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: worker                 # Background worker (no HTTP port needed)
    name: voice-expense-manager
    runtime: docker
    plan: free                   # Free tier — upgrade to "starter" ($7/mo) for always-on
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false              # Must be set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false              # Paste full JSON as a single line
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "500"
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: NODE_ENV
        value: "production"
